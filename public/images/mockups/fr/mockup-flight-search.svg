<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 780" fill="none">
  <!-- Background -->
  <rect width="360" height="780" fill="#F8FAFC"/>
  
  <!-- Header -->
  <rect width="360" height="60" fill="#0F172A"/>
  <text x="180" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">Recherche de vol</text>
  
  <!-- Search Bar -->
  <rect x="20" y="80" width="320" height="56" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="40" y="113" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748B">Numéro de vol ou itinéraire</text>
  
  <!-- Flight Icon -->
  <g transform="translate(290, 95)">
    <path d="M20 8L8 2L2 8L8 14L20 8Z" fill="#3B82F6" opacity="0.2"/>
    <path d="M8 2L14 8L8 14L2 8L8 2Z" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Date Picker -->
  <rect x="20" y="156" width="320" height="56" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <text x="40" y="189" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748B">📅 Date du vol</text>
  
  <!-- Search Button -->
  <rect x="20" y="232" width="320" height="48" rx="12" fill="#3B82F6"/>
  <text x="180" y="261" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Rechercher un vol</text>
  
  <!-- Recent Searches -->
  <text x="20" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#0F172A">Recherches récentes</text>
  
  <!-- Flight Card 1 -->
  <g transform="translate(20, 330)">
    <rect width="320" height="90" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="20" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0F172A">IB3456</text>
    <text x="20" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748B">MAD → BCN</text>
    <text x="20" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8">15:30 • 18 Nov</text>
    <circle cx="285" cy="45" r="8" fill="#10B981"/>
    <text x="300" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#10B981" text-anchor="end">3</text>
  </g>
  
  <!-- Flight Card 2 -->
  <g transform="translate(20, 440)">
    <rect width="320" height="90" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="20" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0F172A">VY2108</text>
    <text x="20" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748B">BCN → MAD</text>
    <text x="20" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94A3B8">09:15 • 20 Nov</text>
    <circle cx="285" cy="45" r="8" fill="#10B981"/>
    <text x="300" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#10B981" text-anchor="end">5</text>
  </g>
  
  <!-- Bottom hint -->
  <text x="180" y="600" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">👥 Le nombre indique les voyageurs actifs</text>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="680" r="30" fill="#3B82F6" opacity="0.1"/>
  <circle cx="310" cy="720" r="40" fill="#10B981" opacity="0.1"/>
</svg>
