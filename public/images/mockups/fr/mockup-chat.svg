<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 780" fill="none">
  <!-- Background -->
  <rect width="360" height="780" fill="#F8FAFC"/>
  
  <!-- Header -->
  <rect width="360" height="60" fill="#0F172A"/>
  <text x="40" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#FFFFFF">←</text>
  <text x="180" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">Chat de groupe</text>
  <text x="320" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#FFFFFF">⋮</text>
  
  <!-- Event Info Banner -->
  <rect x="0" y="60" width="360" height="50" fill="#3B82F6" opacity="0.1"/>
  <text x="180" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#3B82F6" text-anchor="middle">🚕 Taxi Aéroport→Centre • 4 participants</text>
  
  <!-- Chat Messages -->
  
  <!-- Message 1 - Other -->
  <g transform="translate(20, 130)">
    <circle cx="20" cy="10" r="18" fill="#10B981"/>
    <text x="20" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">AM</text>
    <rect x="50" y="0" width="260" height="70" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="65" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Ana María</text>
    <text x="65" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569">Salut ! Je suis déjà au T4, sortie 2</text>
    <text x="295" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">13:15</text>
  </g>
  
  <!-- Message 2 - Me -->
  <g transform="translate(50, 220)">
    <rect x="0" y="0" width="260" height="55" rx="12" fill="#3B82F6"/>
    <text x="15" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#FFFFFF">Parfait ! J'arrive dans 5 min</text>
    <text x="245" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#E0E7FF" text-anchor="end">13:16</text>
  </g>
  
  <!-- Message 3 - Other -->
  <g transform="translate(20, 295)">
    <circle cx="20" cy="10" r="18" fill="#F59E0B"/>
    <text x="20" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">CR</text>
    <rect x="50" y="0" width="260" height="88" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="65" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Carlos R.</text>
    <text x="65" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569">Taxi commandé, plaque 1234ABC</text>
    <text x="65" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569">Arrive dans 2 minutes</text>
    <text x="295" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">13:17</text>
  </g>
  
  <!-- Message 4 - Other -->
  <g transform="translate(20, 403)">
    <circle cx="20" cy="10" r="18" fill="#8B5CF6"/>
    <text x="20" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">ML</text>
    <rect x="50" y="0" width="260" height="70" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="65" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0F172A">María L.</text>
    <text x="65" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569">Top ! Je sors 🏃‍♀️</text>
    <text x="295" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">13:17</text>
  </g>
  
  <!-- Location Share Message -->
  <g transform="translate(20, 493)">
    <circle cx="20" cy="10" r="18" fill="#10B981"/>
    <text x="20" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">AM</text>
    <rect x="50" y="0" width="260" height="100" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="65" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Ana María</text>
    <rect x="65" y="28" width="230" height="50" rx="8" fill="#10B981" opacity="0.1"/>
    <text x="180" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#10B981" text-anchor="middle">📍 Localisation partagée</text>
    <text x="180" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">Terminal T4, Sortie 2</text>
    <text x="295" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8" text-anchor="end">13:18</text>
  </g>
  
  <!-- Typing Indicator -->
  <g transform="translate(20, 613)">
    <circle cx="20" cy="20" r="18" fill="#F59E0B"/>
    <text x="20" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">CR</text>
    <rect x="50" y="10" width="100" height="35" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="75" cy="27" r="4" fill="#94A3B8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="95" cy="27" r="4" fill="#94A3B8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="115" cy="27" r="4" fill="#94A3B8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Chat expires notice -->
  <rect x="20" y="670" width="320" height="40" rx="8" fill="#F59E0B" opacity="0.1"/>
  <text x="180" y="695" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#F59E0B" text-anchor="middle">⏱️ Ce chat expire dans 36 h</text>
  
  <!-- Input Bar -->
  <g transform="translate(0, 720)">
    <rect width="360" height="60" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="15" y="10" width="280" height="40" rx="20" fill="#F1F5F9"/>
    <text x="35" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94A3B8">Écris un message...</text>
    <circle cx="320" cy="30" r="18" fill="#3B82F6"/>
    <text x="320" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle">↑</text>
  </g>
</svg>
