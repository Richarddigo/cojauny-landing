<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 780" fill="none">
  <!-- Background -->
  <rect width="360" height="780" fill="#F8FAFC"/>
  
  <!-- Header -->
  <rect width="360" height="60" fill="#0F172A"/>
  <text x="180" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">Your impact</text>
  
  <!-- Hero Stats Card -->
  <g transform="translate(20, 80)">
    <defs>
      <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
      </linearGradient>
    </defs>
    <rect width="320" height="140" rx="20" fill="url(#grad1)"/>
    <text x="160" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">You've saved this year</text>
    <text x="160" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" text-anchor="middle">€420</text>
    <text x="160" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#E0E7FF" text-anchor="middle">across 12 shared trips</text>
    <text x="160" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">🎯 Goal €500 at 85%!</text>
  </g>
  
  <!-- CO2 Impact -->
  <g transform="translate(20, 240)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Environmental impact</text>
    <rect x="0" y="10" width="320" height="100" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="20" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#64748B">CO₂ AVOIDED</text>
    <text x="20" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#10B981">180 kg</text>
    <text x="300" y="95" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B" text-anchor="end">🌳 = 8 trees planted</text>
  </g>
  
  <!-- Monthly Breakdown -->
  <g transform="translate(20, 360)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Monthly savings</text>
    
    <!-- Simple Bar Chart -->
    <g transform="translate(0, 20)">
      <rect x="0" y="100" width="320" height="1" fill="#E2E8F0"/>
      
      <!-- Bars -->
      <!-- January -->
      <rect x="10" y="70" width="30" height="30" rx="4" fill="#3B82F6" opacity="0.5"/>
      <text x="25" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Jan</text>
      
      <!-- February -->
      <rect x="55" y="50" width="30" height="50" rx="4" fill="#3B82F6" opacity="0.6"/>
      <text x="70" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Feb</text>
      
      <!-- March -->
      <rect x="100" y="40" width="30" height="60" rx="4" fill="#3B82F6" opacity="0.7"/>
      <text x="115" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Mar</text>
      
      <!-- April -->
      <rect x="145" y="30" width="30" height="70" rx="4" fill="#3B82F6" opacity="0.8"/>
      <text x="160" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Apr</text>
      
      <!-- May -->
      <rect x="190" y="10" width="30" height="90" rx="4" fill="#3B82F6"/>
      <text x="205" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">May</text>
      <text x="205" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#3B82F6" text-anchor="middle">€85</text>
      
      <!-- June (current) -->
      <rect x="235" y="20" width="30" height="80" rx="4" fill="#10B981"/>
      <text x="250" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Jun</text>
      <text x="250" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#10B981" text-anchor="middle">€75</text>
      
      <!-- July (projected) -->
      <rect x="280" y="60" width="30" height="40" rx="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="295" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Jul</text>
    </g>
  </g>
  
  <!-- Trip Stats -->
  <g transform="translate(20, 530)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Stats</text>
    
    <g transform="translate(0, 15)">
      <!-- Stat 1 -->
      <rect x="0" y="0" width="150" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="15" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748B">TOTAL TRIPS</text>
      <text x="15" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#3B82F6">12</text>
      
      <!-- Stat 2 -->
      <rect x="170" y="0" width="150" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="185" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748B">AVG SAVINGS</text>
      <text x="185" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#10B981">€35</text>
    </g>
    
    <g transform="translate(0, 100)">
      <!-- Stat 3 -->
      <rect x="0" y="0" width="150" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="15" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748B">PEOPLE MET</text>
      <text x="15" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#F59E0B">28</text>
      
      <!-- Stat 4 -->
      <rect x="170" y="0" width="150" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="185" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748B">AVG RATING</text>
      <text x="185" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#8B5CF6">4.9</text>
    </g>
  </g>
  
  <!-- Share Button -->
  <rect x="20" y="720" width="320" height="48" rx="12" fill="#3B82F6"/>
  <text x="100" y="749" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">📤 Share my impact</text>
</svg>
