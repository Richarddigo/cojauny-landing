<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 800.0" fill="none">
  <rect x="0" y="0" width="360.0" height="20" fill="#1B2335"/>
  <g transform="translate(0, 20)">

  <!-- Background -->
  <rect width="360" height="780" fill="#1B2335"/>
  
  <!-- Header -->
  <rect width="360" height="60" fill="#1B2335"/>
  
  <!-- Content Background -->
  <rect x="0" y="60" width="360" height="720" fill="#F8FAFC"/>
  <text x="180" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">IB3456 events</text>
  
  <!-- Flight Info Banner -->
  <rect x="20" y="75" width="320" height="60" rx="12" fill="#3B82F6" opacity="0.1"/>
  <text x="40" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#3B82F6">✈️ MAD → BCN</text>
  <text x="40" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748B">Today 15:30 • 8 events available</text>
  
  <!-- Event Card 1 -->
  <g transform="translate(20, 155)">
    <rect width="320" height="120" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="20" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#1B2335">🚕 Airport→Downtown shared taxi</text>
    <text x="20" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B">13:30 from Terminal T4</text>
    <text x="20" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B">Organizer: Ana M. ⭐ 4.8</text>
    <rect x="20" y="85" width="100" height="24" rx="8" fill="#10B981" opacity="0.15"/>
    <text x="70" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#10B981" text-anchor="middle">3/4 spots</text>
    <text x="300" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#3B82F6" text-anchor="end">~15€</text>
  </g>
  
  <!-- Event Card 2 -->
  <g transform="translate(20, 290)">
    <rect width="320" height="120" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="20" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#1B2335">🍽️ Dinner in Barcelona</text>
    <text x="20" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B">20:00 in the Gothic Quarter</text>
    <text x="20" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B">Organizer: Carlos R. ⭐ 5.0</text>
    <rect x="20" y="85" width="100" height="24" rx="8" fill="#F59E0B" opacity="0.15"/>
    <text x="70" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#F59E0B" text-anchor="middle">6/8 spots</text>
    <text x="300" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#3B82F6" text-anchor="end">~25€</text>
  </g>
  
  <!-- Event Card 3 -->
  <g transform="translate(20, 425)">
    <rect width="320" height="120" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="20" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#1B2335">🚗 Shared private car</text>
    <text x="20" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B">14:00 from T4</text>
    <text x="20" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B">Organizer: María L. ⭐ 4.9</text>
    <rect x="20" y="85" width="100" height="24" rx="8" fill="#EF4444" opacity="0.15"/>
    <text x="70" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#EF4444" text-anchor="middle">4/4 FULL</text>
    <text x="300" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#94A3B8" text-anchor="end">~20€</text>
  </g>
  
  <!-- Create Event Button -->
  <rect x="20" y="570" width="320" height="52" rx="12" fill="#10B981"/>
  <text x="180" y="601" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">+ Create new event</text>
  
  <!-- Bottom Navigation Hint -->
  <g transform="translate(0, 700)">
    <rect width="360" height="80" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="70" cy="40" r="24" fill="#3B82F6" opacity="0.2"/>
    <circle cx="180" cy="40" r="24" fill="#3B82F6"/>
    <circle cx="290" cy="40" r="24" fill="#3B82F6" opacity="0.2"/>
  </g>
  
  <!-- Decorative -->
  <circle cx="340" cy="140" r="15" fill="#10B981" opacity="0.1"/>

  </g></svg>
