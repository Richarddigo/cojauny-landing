<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Gracias por tu feedback</title>
    <style>
        body {
            margin: 0;
            font-family: 'SF Pro Display', 'Segoe UI', sans-serif;
            background-color: #f1f5f9;
            color: #0f172a;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 36px 32px;
            box-shadow: 0 12px 40px rgba(30, 41, 59, 0.12);
        }

        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #475569;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <p>Hola {{name}},</p>
            <p>
                ¡Gracias por compartir tus comentarios! Leemos cada feedback para priorizar mejoras en la
                beta de Cojauny. Te contactaremos si necesitamos más información.
            </p>
            <p class="footer">Equipo Cojauny · hola@cojauny.com</p>
        </div>
    </div>
</body>

</html>
