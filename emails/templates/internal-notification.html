<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Nuevo evento importante</title>
    <style>
        body {
            margin: 0;
            font-family: 'SF Pro Display', 'Segoe UI', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        .container {
            max-width: 560px;
            margin: 0 auto;
            padding: 36px 24px;
        }

        .card {
            background: rgba(15, 23, 42, 0.7);
            border-radius: 24px;
            padding: 32px;
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .tag {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(79, 70, 229, 0.2);
            color: #a5b4fc;
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <span class="tag">Alerta interna</span>
            <h1 style="margin-top: 24px;">Nuevo feedback crítico</h1>
            <p><strong>Nombre:</strong> {{name}}</p>
            <p><strong>Email:</strong> {{email}}</p>
            <p><strong>Sentimiento:</strong> {{sentiment}}</p>
            <p><strong>Mensaje:</strong></p>
            <p style="white-space: pre-line;">{{message}}</p>
            <p class="footer">Gestiona este caso en el dashboard interno.</p>
        </div>
    </div>
</body>

</html>
