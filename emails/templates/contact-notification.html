<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Nuevo contacto desde la web</title>
    <style>
        body {
            margin: 0;
            font-family: 'SF Pro Display', 'Segoe UI', sans-serif;
            background-color: #f1f5f9;
            color: #0f172a;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 32px 28px;
            box-shadow: 0 16px 48px rgba(15, 23, 42, 0.1);
        }

        .meta {
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .meta li {
            margin-bottom: 12px;
        }

        .message {
            margin-top: 24px;
            padding: 20px;
            border-radius: 20px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h2>Nuevo mensaje desde el formulario de contacto</h2>
            <ul class="meta">
                <li><strong>Nombre:</strong> {{name}}</li>
                <li><strong>Email:</strong> {{email}}</li>
                <li><strong>Idioma:</strong> {{locale}}</li>
            </ul>
            <div class="message">
                {{message}}
            </div>
        </div>
    </div>
</body>

</html>
